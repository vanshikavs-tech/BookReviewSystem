{% extends "base.html" %}
{% block title %}Log In &mdash; Brew &amp; Books{% endblock %}
{% block content %}

<div class="form-panel">
    <h2>Welcome Back</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-shelf w-100">Log In</button>
    </form>
    <p class="mt-3 text-center">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div>

{% endblock %}
